# Shared CI for Laravel apps. Callers: see README.md.
#
# The app must define these composer scripts (check mode only, never writing files):
#   test:lint           pint --test, rector --dry-run, frontend format/lint checks
#   test:types          phpstan (plus frontend type checks if the app wants them)
#   test:unit           pest (unit + feature)
# Optional:
#   ci:setup            app-specific preparation after .env + APP_KEY (passport keys, ziggy, wayfinder, dirs...)
#   test:type-coverage  run in the quality job when defined
#   test:browser        run in the browser job when tests/Browser exists (default: pest tests/Browser)
name: laravel

on:
  workflow_call:
    inputs:
      php-versions:
        description: JSON array of PHP versions for the tests job. Include the lowest version production runs.
        type: string
        default: '["8.4", "8.5"]'
      quality-php:
        description: PHP version for the quality and browser jobs.
        type: string
        default: '8.5'
      php-extensions:
        description: Extra PHP extensions for setup-php (comma separated).
        type: string
        default: ''
      node-version:
        type: string
        default: '24'
      runs-on:
        description: JSON runner labels.
        type: string
        default: '["self-hosted", "mini23"]'
      coverage:
        description: Coverage driver for the tests job (pcov, xdebug, none).
        type: string
        default: pcov

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.quality-php }}
          extensions: ${{ inputs.php-extensions }}
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          if jq -e '.scripts["ci:setup"]' composer.json >/dev/null; then composer ci:setup; fi

      - name: Lint
        run: composer test:lint

      - name: Types
        run: composer test:types

      - name: Type coverage
        run: |
          if jq -e '.scripts["test:type-coverage"]' composer.json >/dev/null; then
            composer test:type-coverage
          else
            echo "No test:type-coverage script, skipping."
          fi

      - name: Build
        run: |
          npm run build
          if jq -e '.scripts["build:ssr"]' package.json >/dev/null; then npm run build:ssr; fi

  tests:
    name: tests (PHP ${{ matrix.php }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ inputs.php-extensions }}
          tools: composer:v2
          coverage: ${{ inputs.coverage }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          if jq -e '.scripts["ci:setup"]' composer.json >/dev/null; then composer ci:setup; fi

      # Client build only: an SSR bundle makes Inertia call the SSR server during tests.
      - name: Build assets
        run: npm run build

      - name: Tests
        run: composer test:unit

  browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Look for browser tests
        id: detect
        run: |
          if [ -d tests/Browser ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No tests/Browser, skipping."; fi

      - if: steps.detect.outputs.present == 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.quality-php }}
          extensions: ${{ inputs.php-extensions }}
          tools: composer:v2
          coverage: none

      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci
          echo "PLAYWRIGHT_VERSION=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        if: steps.detect.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright
        if: steps.detect.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: Prepare app
        if: steps.detect.outputs.present == 'true'
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          if jq -e '.scripts["ci:setup"]' composer.json >/dev/null; then composer ci:setup; fi
          npm run build

      - name: Browser tests
        if: steps.detect.outputs.present == 'true'
        run: |
          if jq -e '.scripts["test:browser"]' composer.json >/dev/null; then
            composer test:browser
          else
            vendor/bin/pest --compact tests/Browser
          fi
