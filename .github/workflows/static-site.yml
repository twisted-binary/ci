# Shared CI for static / frontend sites (Astro, Nuxt, Next). Callers: see README.md.
#
# Runs, in order, each of these npm scripts that the site defines (check mode only):
#   format:check, lint:check, check (e.g. astro check), typecheck, test
# then `npm run <build-script>`, then an optional smoke check of the built output.
name: static-site

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      runs-on:
        description: JSON runner labels.
        type: string
        default: '["self-hosted", "mini23"]'
      build-script:
        type: string
        default: build
      output-dir:
        description: Built site directory to smoke-check (e.g. dist, .output/public). Empty skips the check.
        type: string
        default: ''
      expect-sitemap:
        description: Fail the smoke check when the output has no sitemap*.xml.
        type: boolean
        default: true
      serve-command:
        description: For server-rendered sites, the command that starts the built server (it must honor PORT). Empty skips the server smoke check.
        type: string
        default: ''
      smoke-paths:
        description: Space-separated paths the server smoke check requests. Each must return 200; HTML pages must have a <title>.
        type: string
        default: / /sitemap.xml /robots.txt

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect scripts
        id: scripts
        run: echo "list=$(jq -c '.scripts // {} | keys' package.json)" >> "$GITHUB_OUTPUT"

      - name: Format
        if: contains(fromJSON(steps.scripts.outputs.list), 'format:check')
        run: npm run format:check

      - name: Lint
        if: contains(fromJSON(steps.scripts.outputs.list), 'lint:check')
        run: npm run lint:check

      - name: Check
        if: contains(fromJSON(steps.scripts.outputs.list), 'check')
        run: npm run check

      - name: Types
        if: contains(fromJSON(steps.scripts.outputs.list), 'typecheck')
        run: npm run typecheck

      - name: Tests
        if: contains(fromJSON(steps.scripts.outputs.list), 'test')
        run: npm test

      - name: Build
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
        run: npm run "$BUILD_SCRIPT"

      - name: Smoke-check output
        if: inputs.output-dir != ''
        env:
          OUT: ${{ inputs.output-dir }}
          EXPECT_SITEMAP: ${{ inputs.expect-sitemap }}
        run: |
          test -f "$OUT/index.html" || { echo "::error::$OUT/index.html missing"; exit 1; }
          grep -qi '<title>[^<]\+</title>' "$OUT/index.html" || { echo "::error::$OUT/index.html has no <title>"; exit 1; }
          pages=$(find "$OUT" -name '*.html' | wc -l)
          echo "Built $pages HTML pages."
          if [ "$EXPECT_SITEMAP" = "true" ]; then
            ls "$OUT"/sitemap*.xml >/dev/null 2>&1 || { echo "::error::no sitemap*.xml in $OUT"; exit 1; }
          fi

      - name: Smoke-check server
        if: inputs.serve-command != ''
        env:
          SERVE: ${{ inputs.serve-command }}
          SMOKE_PATHS: ${{ inputs.smoke-paths }}
          PORT: '4381'
          HOST: 127.0.0.1
        run: |
          bash -c "$SERVE" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          # Children first (npm start -> node), and never let cleanup change the exit code under bash -e.
          trap 'pkill -P $pid 2>/dev/null || true; kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do curl -s -o /dev/null "http://127.0.0.1:$PORT/" && break; sleep 1; done
          rc=0
          for p in $SMOKE_PATHS; do
            out=$(curl -sL -o "$RUNNER_TEMP/page" -w '%{http_code} %{content_type}' "http://127.0.0.1:$PORT$p")
            code=${out%% *}; ctype=${out#* }; ok=true
            [ "$code" = 200 ] || ok=false
            case "$ctype" in text/html*) grep -qi '<title>[^<]\+</title>' "$RUNNER_TEMP/page" || ok=false ;; esac
            echo "$p -> $code $ctype"
            $ok || { echo "::error::$p failed the smoke check"; rc=1; }
          done
          if [ $rc != 0 ]; then echo "--- server log"; tail -50 "$RUNNER_TEMP/server.log"; fi
          exit $rc
